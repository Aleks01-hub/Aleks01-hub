<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Alex Silva — Software Engineering</title>
  <desc id="desc">Minimalist dark banner with abstract lines and software engineering title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1000" cy="90" r="180" fill="#ffffff" opacity=".025"/>
  <circle cx="1000" cy="90" r="130" fill="none" stroke="#d4d4d8" stroke-opacity=".15"/>
  <circle cx="1000" cy="90" r="90" fill="none" stroke="#d4d4d8" stroke-opacity=".12"/>
  <path d="M850 240 L950 140 L1010 200 L1120 90" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".65"/>
  <circle cx="850" cy="240" r="4" fill="#fafafa"/><circle cx="950" cy="140" r="4" fill="#fafafa"/><circle cx="1010" cy="200" r="4" fill="#fafafa"/><circle cx="1120" cy="90" r="4" fill="#fafafa"/>
  <text x="76" y="105" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="4">HELLO, WORLD</text>
  <text x="72" y="166" fill="#fafafa" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Alex Silva</text>
  <rect x="76" y="190" width="56" height="3" rx="1.5" fill="#fafafa"/>
  <text x="76" y="230" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size="22">Software Engineering Student</text>
  <text x="76" y="265" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">IFCE  /  Ceará, Brazil  /  Building useful software</text>
</svg>